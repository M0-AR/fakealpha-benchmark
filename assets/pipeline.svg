<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">FakeAlpha benchmark pipeline</title>
  <desc id="pipeline-desc">Live ETF data flows through causal features and a 128-strategy candidate pool into an honest walk-forward run. Six contamination families are paired with the honest run, then scored by five diagnostics and a re-execution audit.</desc>
  <rect width="1200" height="330" rx="24" fill="#f7f4ea"/>
  <text x="40" y="42" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2" fill="#0c7a63">THE BENCHMARK PIPELINE</text>
  <text x="1160" y="42" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#6a7a72">80 paired replicates · same data · same seed</text>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
    <g>
      <rect x="40" y="78" width="172" height="136" rx="14" fill="#fffdf8" stroke="#d7dccf"/>
      <rect x="40" y="78" width="172" height="5" rx="2.5" fill="#0c7a63"/>
      <circle cx="62" cy="106" r="12" fill="#e6f4ec"/>
      <text x="62" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#0c7a63">01</text>
      <text x="84" y="111" font-size="13" font-weight="700" fill="#10231f">Live data</text>
      <text x="58" y="139" font-size="10.5" fill="#5d6f68">12 liquid US ETFs</text>
      <text x="58" y="157" font-size="10.5" fill="#5d6f68">2005 to 23 Oct 2026</text>
      <text x="58" y="175" font-size="10.5" fill="#5d6f68">4,984-row panel</text>
      <text x="58" y="197" font-size="9.5" font-weight="600" fill="#0c7a63">SHA-256 manifest</text>
    </g>
    <path d="M216 146h14m-5-5 5 5-5 5" stroke="#9baba2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="234" y="78" width="172" height="136" rx="14" fill="#fffdf8" stroke="#d7dccf"/>
      <rect x="234" y="78" width="172" height="5" rx="2.5" fill="#0c7a63"/>
      <circle cx="256" cy="106" r="12" fill="#e6f4ec"/>
      <text x="256" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#0c7a63">02</text>
      <text x="278" y="111" font-size="13" font-weight="700" fill="#10231f">Causal features</text>
      <text x="252" y="139" font-size="10.5" fill="#5d6f68">16 signals</text>
      <text x="252" y="157" font-size="10.5" fill="#5d6f68">Momentum, trend, vol</text>
      <text x="252" y="175" font-size="10.5" fill="#5d6f68">Point-in-time only</text>
      <text x="252" y="197" font-size="9.5" font-weight="600" fill="#0c7a63">No look-ahead</text>
    </g>
    <path d="M410 146h14m-5-5 5 5-5 5" stroke="#9baba2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="428" y="78" width="172" height="136" rx="14" fill="#fffdf8" stroke="#d7dccf"/>
      <rect x="428" y="78" width="172" height="5" rx="2.5" fill="#0c7a63"/>
      <circle cx="450" cy="106" r="12" fill="#e6f4ec"/>
      <text x="450" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#0c7a63">03</text>
      <text x="472" y="111" font-size="13" font-weight="700" fill="#10231f">Candidate pool</text>
      <text x="446" y="139" font-size="10.5" fill="#5d6f68">128 strategies</text>
      <text x="446" y="157" font-size="10.5" fill="#5d6f68">4 portfolio sizes</text>
      <text x="446" y="175" font-size="10.5" fill="#5d6f68">2 weighting schemes</text>
      <text x="446" y="197" font-size="9.5" font-weight="600" fill="#0c7a63">40 sampled per run</text>
    </g>
    <path d="M604 146h14m-5-5 5 5-5 5" stroke="#9baba2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="622" y="78" width="172" height="136" rx="14" fill="#fffdf8" stroke="#d7dccf"/>
      <rect x="622" y="78" width="172" height="5" rx="2.5" fill="#0c7a63"/>
      <circle cx="644" cy="106" r="12" fill="#e6f4ec"/>
      <text x="644" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#0c7a63">04</text>
      <text x="666" y="111" font-size="13" font-weight="700" fill="#10231f">Honest run</text>
      <text x="640" y="139" font-size="10.5" fill="#5d6f68">Annual walk-forward</text>
      <text x="640" y="157" font-size="10.5" fill="#5d6f68">2-day embargo</text>
      <text x="640" y="175" font-size="10.5" fill="#5d6f68">Weekly rebalance</text>
      <text x="640" y="197" font-size="9.5" font-weight="600" fill="#0c7a63">5 bps one-way cost</text>
    </g>
    <path d="M798 146h14m-5-5 5 5-5 5" stroke="#9baba2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="816" y="78" width="172" height="136" rx="14" fill="#fffdf8" stroke="#d7dccf"/>
      <rect x="816" y="78" width="172" height="5" rx="2.5" fill="#e07a2f"/>
      <circle cx="838" cy="106" r="12" fill="#fbeadb"/>
      <text x="838" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#b25a14">05</text>
      <text x="860" y="111" font-size="13" font-weight="700" fill="#10231f">Leak pair</text>
      <text x="834" y="139" font-size="10.5" fill="#5d6f68">6 contamination families</text>
      <text x="834" y="157" font-size="10.5" fill="#5d6f68">80 replicates each</text>
      <text x="834" y="175" font-size="10.5" fill="#5d6f68">Only the leak changes</text>
      <text x="834" y="197" font-size="9.5" font-weight="600" fill="#b25a14">Paired by design</text>
    </g>
    <path d="M992 146h14m-5-5 5 5-5 5" stroke="#9baba2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="1010" y="78" width="150" height="136" rx="14" fill="#071b16" stroke="#071b16"/>
      <circle cx="1032" cy="106" r="12" fill="#17382f"/>
      <text x="1032" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#d9f36a">06</text>
      <text x="1054" y="111" font-size="13" font-weight="700" fill="#fffdf8">Verdict</text>
      <text x="1028" y="139" font-size="10.5" fill="#b9c9c1">DSR · PBO</text>
      <text x="1028" y="157" font-size="10.5" fill="#b9c9c1">Reality check</text>
      <text x="1028" y="175" font-size="10.5" fill="#b9c9c1">Split-half · audit</text>
      <text x="1028" y="197" font-size="9.5" font-weight="600" fill="#d9f36a">Calibrated at 95%</text>
    </g>
  </g>

  <rect x="40" y="242" width="1120" height="48" rx="12" fill="#e9efe5"/>
  <text x="60" y="271" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#10231f">Every contaminated run is compared with the honest run on the same candidate subset, the same dates, and the same random seed.</text>
  <text x="1140" y="271" text-anchor="end" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0c7a63">560 family-runs</text>
</svg>
